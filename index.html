<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Ordens SAP</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dde1e8;--ok:#1f9d55;--warn:#d98e04;--bad:#d64545;--na:#9aa1b0;--pri:#1f5fbf}
  @media (prefers-color-scheme:dark){:root{--bg:#14171e;--card:#1c212b;--tx:#e6e9ef;--mut:#98a0b3;--bd:#2c3340;--pri:#6aa3ff}}
  *{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
  header{padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
  h1{margin:0;font-size:18px}h2{font-size:14px;margin:0 0 8px}
  main{padding:16px 20px;max-width:1500px;margin:auto}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .slot small{color:var(--mut);display:block;margin-bottom:6px}
  .map{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin-top:8px;font-size:12px;align-items:center}
  select,input[type=text],textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:5px;padding:5px;font:inherit;max-width:100%}
  textarea{width:100%;height:60px}
  button{background:var(--pri);color:#fff;border:0;border-radius:5px;padding:7px 12px;font:inherit;cursor:pointer}
  button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .filters label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:2px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;min-width:120px}
  .kpi b{font-size:20px;display:block}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--mut);cursor:pointer;white-space:nowrap}
  tr.row{cursor:pointer}tr.row:hover{background:color-mix(in srgb,var(--pri) 8%,transparent)}
  .dot{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
  .ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.na{background:var(--na)}
  .det{background:var(--bg);font-size:13px}.det td{padding:10px 16px}
  .det ul{margin:2px 0 8px;padding-left:18px}
  .mut{color:var(--mut)}
  @media(max-width:700px){main{padding:10px}}
</style>
</head>
<body>
<header><h1>Painel de Ordens SAP — andaime, apoio, risco e material</h1></header>
<main>

<div class="card">
  <h2>1. Carregar planilhas</h2>
  <div class="grid" id="slots"></div>
  <p class="mut" style="margin:10px 0 0">Os arquivos são lidos só no seu navegador (nada é enviado para internet). As colunas são reconhecidas automaticamente; corrija nos seletores se necessário — a escolha fica salva.</p>
  <p style="margin:10px 0 0"><button class="sec" onclick="loadDemo()">Carregar exemplo</button></p>
</div>

<div class="card">
  <h2>2. Regras</h2>
  <div class="filters">
    <label>Texto que identifica a operação de andaime<input type="text" id="kwScaf" value="andaime"></label>
    <label>Status que significa "andaime pronto" (separe por vírgula)<input type="text" id="kwDone" value="CNF, ENCE, ENC, CONF, CTEC, TECO, FINAL" size="38"></label>
    <label>Apoio: considerar disciplina = <select id="discMode"><option value="wc4">primeiras 4 letras do centro de trabalho</option><option value="wc">centro de trabalho inteiro</option><option value="wc3">primeiras 3 letras</option><option value="wc2">primeiras 2 letras</option></select></label>
    <button onclick="render()">Aplicar</button>
  </div>
</div>

<div class="card">
  <h2>3. Filtros</h2>
  <div class="filters">
    <label>Buscar<input type="text" id="fSearch" placeholder="ordem ou descrição" oninput="render()"></label>
    <label>Semana<select id="fWeek" onchange="render()"></select></label>
    <label>Disciplina<select id="fDisc" onchange="render()"></select></label>
    <label>Andaime<select id="fScaf" onchange="render()"><option value="">todos</option><option value="ok">pronto</option><option value="warn">atenção</option><option value="bad">pendente</option><option value="na">sem andaime</option></select></label>
    <label>Material<select id="fMat" onchange="render()"><option value="">todos</option><option value="ok">baixado</option><option value="warn">parcial</option><option value="bad">pendente</option><option value="na">sem material</option></select></label>
    <label><span><input type="checkbox" id="fPend" onchange="render()"> só com pendência</span></label>
    <label style="flex:1;min-width:240px">Minha relação de ordens (colar, uma por linha)<textarea id="fList" oninput="render()"></textarea></label>
    <button onclick="exportXlsx()">Exportar Excel</button>
  </div>
</div>

<div class="kpis" id="kpis"></div>
<div id="tableWrap"></div>
</main>

<script src="lib/xlsx.full.min.js"></script>
<script>
// ---------- configuração de planilhas e colunas ----------
const SLOTS = {
  gpi:{title:'Relação do GPI (ordens/tarefas niveladas)',hint:'Planilha do GPI da semana',
    fields:{ordem:['ordem','order','nº ordem','n° ordem','numero da ordem','nr ordem','ordem manutencao'],
            tarefa:['tarefa','task','atividade'],
            semana:['semana','week','sem'],
            descricao:['descricao','descrição','texto breve','texto','description'],
            disciplina:['disciplina','especialidade','area','área','centro trab','centro de trabalho']}},
  ops:{title:'Operações das ordens (IW37N / IW49N)',hint:'Uma linha por operação',
    fields:{ordem:['ordem','order','nº ordem','n° ordem'],
            operacao:['operacao','operação','oper','op.','atividade'],
            texto:['texto breve operacao','texto operação','texto breve','descricao','descrição','texto','description'],
            centro:['centro trab','centro de trab','ctrab','work center','centro trabalho','cen.trab'],
            status:['status do sistema','status sistema','status usuario','status usuário','status','stat'],
            descOrdem:['descricao ordem','descrição ordem','texto ordem','texto da ordem']}},
  mat:{title:'Materiais / reservas',hint:'Uma linha por componente (IW37N, IW38 ou MB25)',
    fields:{ordem:['ordem','order','nº ordem','n° ordem'],
            material:['material','componente','item','componen'],
            matDesc:['descricao material','texto breve material','texto breve','descricao','descrição','denominacao','denominação'],
            qtdRes:['qtd reservada','quantidade necessaria','qtd necessaria','qtd.necess','quantidade necess','necessidade','qtd nec','requirement qty','qtd. reserv'],
            qtdBaixa:['qtd retirada','quantidade retirada','qtd.retirada','qtd baixada','retirada','withdrawn','qtd. retir','qtd.ret']}}
};
const REQ = {gpi:['ordem'],ops:['ordem'],mat:['ordem','qtdRes','qtdBaixa']};
const state = {gpi:null,ops:null,mat:null};   // {headers, rows, map}

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const normOrd = v => String(v==null?'':v).trim().replace(/\.0+$/,'').replace(/^0+/,'');
function num(v){ if(typeof v==='number')return v; let s=String(v||'').trim(); if(!s)return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s.replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }

function autoMap(headers, fields){
  const map={}, used=new Set(); const nh=headers.map(norm);
  for(const [f,syns] of Object.entries(fields)){
    let best=-1,bs=0;
    nh.forEach((h,i)=>{ if(used.has(i)||!h)return;
      syns.forEach(sy=>{const n=norm(sy); let sc=h===n?3:(h.startsWith(n)?2:(h.includes(n)?1:0)); if(sc>bs){bs=sc;best=i;}});});
    if(best>=0){map[f]=headers[best];used.add(best);}
  }
  return map;
}

// ---------- leitura de arquivos ----------
function buildSlots(){
  const el=document.getElementById('slots'); el.innerHTML='';
  for(const [k,s] of Object.entries(SLOTS)){
    const d=document.createElement('div'); d.className='slot card'; d.style.margin=0;
    d.innerHTML=`<b>${s.title}</b><small>${s.hint}</small><input type="file" accept=".xlsx,.xls,.csv,.txt" id="file_${k}"><div id="info_${k}" class="mut" style="margin-top:6px"></div><div id="map_${k}" class="map"></div>`;
    el.appendChild(d);
    d.querySelector('input').addEventListener('change',e=>readFile(k,e.target.files[0]));
  }
}
function readFile(k,file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{ const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
    setData(k,rows,file.name); };
  r.readAsArrayBuffer(file);
}
function setData(k,rows,name){
  const headers=rows.length?Object.keys(rows[0]):[];
  let saved={}; try{saved=JSON.parse(localStorage.getItem('map_'+k)||'{}')}catch(e){}
  const map=autoMap(headers,SLOTS[k].fields);
  for(const f in saved) if(headers.includes(saved[f])) map[f]=saved[f];
  state[k]={headers,rows,map};
  document.getElementById('info_'+k).textContent=`${name}: ${rows.length} linhas`;
  const m=document.getElementById('map_'+k); m.innerHTML='';
  for(const f of Object.keys(SLOTS[k].fields)){
    const lab=document.createElement('span'); lab.textContent=f+(REQ[k].includes(f)?' *':'');
    const sel=document.createElement('select'); sel.innerHTML='<option value="">— não usar —</option>'+headers.map(h=>`<option ${map[f]===h?'selected':''}>${h}</option>`).join('');
    sel.onchange=()=>{ state[k].map[f]=sel.value; try{localStorage.setItem('map_'+k,JSON.stringify(state[k].map))}catch(e){} render(); };
    m.append(lab,sel);
  }
  render();
}

// ---------- consolidação ----------
function disc(centro){ const c=String(centro||'').trim().toUpperCase(); const m=document.getElementById('discMode').value;
  return m==='wc'?c:c.slice(0,{wc4:4,wc3:3,wc2:2}[m]); }
const get=(r,m,f)=>m[f]?r[m[f]]:'';

function consolidate(){
  const orders=new Map();  // ordem -> obj
  const O=(id)=>{ if(!orders.has(id)) orders.set(id,{ordem:id,desc:'',semana:'',disc:'',tarefa:'',ops:[],mats:[],inGpi:false}); return orders.get(id); };
  if(state.gpi){ const m=state.gpi.map; state.gpi.rows.forEach(r=>{ const id=normOrd(get(r,m,'ordem')); if(!id)return;
      const o=O(id); o.inGpi=true; o.semana=String(get(r,m,'semana')||o.semana); o.desc=String(get(r,m,'descricao')||o.desc);
      o.disc=String(get(r,m,'disciplina')||o.disc); o.tarefa=String(get(r,m,'tarefa')||o.tarefa); }); }
  if(state.ops){ const m=state.ops.map; state.ops.rows.forEach(r=>{ const id=normOrd(get(r,m,'ordem')); if(!id)return;
      const o=O(id); if(!o.desc) o.desc=String(get(r,m,'descOrdem')||'');
      o.ops.push({op:String(get(r,m,'operacao')),texto:String(get(r,m,'texto')),centro:String(get(r,m,'centro')),status:String(get(r,m,'status'))}); }); }
  if(state.mat){ const m=state.mat.map; state.mat.rows.forEach(r=>{ const id=normOrd(get(r,m,'ordem')); if(!id)return;
      const o=O(id); o.mats.push({mat:String(get(r,m,'material')),desc:String(get(r,m,'matDesc')),res:num(get(r,m,'qtdRes')),bx:num(get(r,m,'qtdBaixa'))}); }); }
  const kwS=norm(document.getElementById('kwScaf').value);
  const kwD=document.getElementById('kwDone').value.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean);
  const hasStatus=state.ops&&state.ops.map.status;
  for(const o of orders.values()){
    // andaime
    o.scaf=o.ops.filter(p=>norm(p.texto).includes(kwS));
    if(!state.ops) o.sScaf=['na','sem planilha de operações'];
    else if(!o.scaf.length) o.sScaf=['na','sem operação de andaime'];
    else if(!hasStatus) o.sScaf=['warn','existe (status não mapeado)'];
    else{ const done=o.scaf.filter(p=>kwD.some(k=>p.status.toUpperCase().split(/[\s,;]+/).includes(k)||p.status.toUpperCase().includes(k)));
      o.sScaf= done.length===o.scaf.length?['ok','pronto']:done.length?['warn','parcial']:['bad','pendente']; }
    // apoio (operações que não são andaime, de outras disciplinas)
    const others=o.ops.filter(p=>!o.scaf.includes(p)&&p.centro);
    const cnt={}; others.forEach(p=>{const d=disc(p.centro); cnt[d]=(cnt[d]||0)+1;});
    const main=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    o.support=others.filter(p=>disc(p.centro)!==main); o.mainDisc=main||'';
    if(!o.disc) o.disc=o.mainDisc;
    o.sSup= !state.ops?['na','—']: o.support.length?['warn','apoio: '+[...new Set(o.support.map(p=>disc(p.centro)))].join(', ')]:['na','sem apoio'];
    // risco
    o.sRisk=['na','não avaliado'];
    // material
    const mats=o.mats.filter(x=>x.res>0);
    if(!state.mat) o.sMat=['na','sem planilha de materiais'];
    else if(!mats.length) o.sMat=['na','sem material'];
    else{ const full=mats.filter(x=>x.bx>=x.res), any=mats.filter(x=>x.bx>0);
      o.sMat= full.length===mats.length?['ok','baixado']:any.length?['warn',`parcial ${full.length}/${mats.length}`]:['bad',`pendente 0/${mats.length}`]; }
    o.pend=o.sScaf[0]==='bad'||o.sScaf[0]==='warn'&&hasStatus||o.sMat[0]==='bad'||o.sMat[0]==='warn';
  }
  return [...orders.values()];
}

// ---------- tela ----------
let sortKey='ordem',sortDir=1,expanded=new Set(),current=[];
const pill=(s)=>`<span class="dot ${s[0]}">${s[1]}</span>`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function fillSelect(id,vals){ const el=document.getElementById(id), cur=el.value;
  el.innerHTML='<option value="">todas</option>'+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join(''); }

function render(){
  let all=consolidate();
  const listTxt=document.getElementById('fList').value;
  const list=new Set(listTxt.split(/[\s,;]+/).map(normOrd).filter(Boolean));
  if(list.size) all=all.filter(o=>list.has(o.ordem));
  else if(state.gpi) all=all.filter(o=>o.inGpi);
  fillSelect('fWeek',[...new Set(all.map(o=>o.semana).filter(Boolean))].sort());
  fillSelect('fDisc',[...new Set(all.map(o=>o.disc).filter(Boolean))].sort());
  const q=norm(document.getElementById('fSearch').value), w=fWeek.value, d=fDisc.value, sc=fScaf.value, mt=fMat.value, pe=fPend.checked;
  let rows=all.filter(o=>(!q||norm(o.ordem+' '+o.desc).includes(q))&&(!w||o.semana===w)&&(!d||o.disc===d)&&(!sc||o.sScaf[0]===sc)&&(!mt||o.sMat[0]===mt)&&(!pe||o.pend));
  const val=o=>({ordem:o.ordem,desc:o.desc,semana:o.semana,disc:o.disc,scaf:o.sScaf[0],sup:o.sSup[1],mat:o.sMat[0]}[sortKey]);
  rows.sort((a,b)=>String(val(a)).localeCompare(String(val(b)),'pt',{numeric:true})*sortDir);
  current=rows;
  const c=(f)=>rows.filter(f).length;
  document.getElementById('kpis').innerHTML=[
    ['Ordens',rows.length],['Andaime pronto',c(o=>o.sScaf[0]==='ok')],['Andaime pendente',c(o=>o.sScaf[0]==='bad'||o.sScaf[0]==='warn')],
    ['Com apoio',c(o=>o.support.length)],['Material baixado',c(o=>o.sMat[0]==='ok')],['Material pendente/parcial',c(o=>o.sMat[0]==='bad'||o.sMat[0]==='warn')]
  ].map(([t,n])=>`<div class="kpi"><b>${n}</b>${t}</div>`).join('');
  if(!all.length){ tableWrap.innerHTML='<p class="mut">Carregue as planilhas acima para ver o painel.</p>'; return; }
  const th=(k,t)=>`<th onclick="sortBy('${k}')">${t}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`;
  let h=`<table><tr>${th('ordem','Ordem')}${th('desc','Descrição')}${th('semana','Semana')}${th('disc','Disciplina')}${th('scaf','Andaime')}${th('sup','Apoio outra disc.')}<th>Risco nível 2</th>${th('mat','Material')}</tr>`;
  for(const o of rows){
    h+=`<tr class="row" onclick="toggle('${o.ordem}')"><td>${esc(o.ordem)}</td><td>${esc(o.desc)}</td><td>${esc(o.semana)}</td><td>${esc(o.disc)}</td><td>${pill(o.sScaf)}</td><td>${pill(o.sSup)}</td><td>${pill(o.sRisk)}</td><td>${pill(o.sMat)}</td></tr>`;
    if(expanded.has(o.ordem)){
      const li=a=>a.length?'<ul>'+a.join('')+'</ul>':'<div class="mut">—</div>';
      h+=`<tr class="det"><td colspan="8"><b>Andaime</b>${li(o.scaf.map(p=>`<li>${esc(p.op)} ${esc(p.texto)} — ${esc(p.centro)} — status: ${esc(p.status||'?')}</li>`))}
        <b>Apoio de outras disciplinas</b>${li(o.support.map(p=>`<li>${esc(p.op)} ${esc(p.texto)} — ${esc(p.centro)} — status: ${esc(p.status||'?')}</li>`))}
        <b>Materiais</b>${li(o.mats.map(x=>`<li>${esc(x.mat)} ${esc(x.desc)} — reservado ${x.res}, baixado ${x.bx} ${x.res>0&&x.bx<x.res?'<b style="color:var(--bad)">(falta '+(x.res-x.bx)+')</b>':''}</li>`))}</td></tr>`;
    }
  }
  tableWrap.innerHTML=h+'</table>';
}
function sortBy(k){ if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=1;} render(); }
function toggle(id){ expanded.has(id)?expanded.delete(id):expanded.add(id); render(); }

function exportXlsx(){
  const data=current.map(o=>({Ordem:o.ordem,Descrição:o.desc,Semana:o.semana,Disciplina:o.disc,Andaime:o.sScaf[1],Apoio:o.sSup[1],'Risco nível 2':o.sRisk[1],Material:o.sMat[1],
    'Materiais pendentes':o.mats.filter(x=>x.res>x.bx).map(x=>`${x.mat} (falta ${x.res-x.bx})`).join('; ')}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Resumo');
  XLSX.writeFile(wb,'resumo_ordens.xlsx');
}

// ---------- exemplo ----------
function loadDemo(){
  setData('gpi',[{Ordem:'4000101',Semana:'48',Descrição:'Troca de válvula P-101',Disciplina:'MEC'},{Ordem:'4000102',Semana:'48',Descrição:'Calibração PT-205',Disciplina:'INS'},{Ordem:'4000103',Semana:'48',Descrição:'Reparo de estrutura TQ-3',Disciplina:'CAL'}],'exemplo_gpi');
  setData('ops',[
    {Ordem:'4000101',Operação:'0010',Texto:'Montagem de andaime','Centro Trab':'AND-01','Status do sistema':'CNF'},
    {Ordem:'4000101',Operação:'0020',Texto:'Trocar válvula','Centro Trab':'MEC-01','Status do sistema':'LIB'},
    {Ordem:'4000101',Operação:'0030',Texto:'Isolamento elétrico','Centro Trab':'ELE-01','Status do sistema':'LIB'},
    {Ordem:'4000102',Operação:'0010',Texto:'Calibrar transmissor','Centro Trab':'INS-01','Status do sistema':'LIB'},
    {Ordem:'4000103',Operação:'0010',Texto:'Andaime fachadeiro','Centro Trab':'AND-01','Status do sistema':'LIB'},
    {Ordem:'4000103',Operação:'0020',Texto:'Soldar suporte','Centro Trab':'CAL-01','Status do sistema':'LIB'}],'exemplo_operacoes');
  setData('mat',[
    {Ordem:'4000101',Material:'10001',Descrição:'Válvula gaveta 4"','Qtd Reservada':'1','Qtd Retirada':'1'},
    {Ordem:'4000101',Material:'10002',Descrição:'Junta espiralada','Qtd Reservada':'2','Qtd Retirada':'0'},
    {Ordem:'4000103',Material:'20001',Descrição:'Eletrodo E7018','Qtd Reservada':'5','Qtd Retirada':'5'}],'exemplo_materiais');
}

buildSlots(); render();
</script>
</body>
</html>
